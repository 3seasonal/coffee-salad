#################
# structure:
# - calendar: the configuration for making the calendar
# - columns
# bg_color: (optional) the background color of the cell


calendar:

  #################
  # calander base functionality
  xlsx_name: 2025_calendar_generated.xlsx
  worksheet_name: 2025 by week
  start_row: 1 #1 based
  start_column: 1 #1 based
  year: 2025
  week_stats_on: 1 #Monday as per ISO8601
  underflow: 3 #no of rows (or other type) before the start and end date - rounded
  overflow: 3 #no of rows (or other type) after the start and end date - rounded
  mode: dev 
  debug: True
  date_style: date
  date_legend_style: date_legend
  column_heading_style: heading

  #################
  # calander columns
  # columns{
  #   xcolumn{
  #   type: iterator/term/week_day/annotation
  #   iterate: True/False
  #   (start):x
  #   (increment):x
  #   (terms){
  #     term_name{
  #       start_date: yyyy-mm-dd
  #       end_date: yyyy-mm-dd
  #       bg_color: 000000  
  #     }
  #   width: 00
  #   }
  # } 
  # }
  
  columns:
    # week number
    week:
      type: iterator
      start: 1
      increment: 1
      width: 6
      style: week
    
    # university Trimesters
    Uni:
      type: term
      iterate: True
      start: 1
      style: uni-heading
      terms:
        summer school:
          start_date: 2025-01-06
          end_date: 2025-02-28
          style: uni-tri-ss
        trimester 1:
          start_date: 2025-02-03
          end_date: 2025-05-10
          style: uni-tri-1
        trimester 2:
          start_date: 2025-05-26
          end_date: 2025-08-30
          style: uni-tri-2
        trimester 3:
          start_date: 2025-09-08
          end_date: 2025-12-06
          style: uni-tri-3
      width: 12

    # School terms
    school:
      type: term
      iterate: True
      start: 1
      style: school-heading
      terms:
        term 1:
          start_date: 2025-01-28
          end_date: 2025-04-11
          style: school-term-1
        term 2:
          start_date: 2025-04-28
          end_date: 2025-07-04
          style: school-term-2
        term 3:
          start_date: 2025-07-21
          end_date: 2025-09-26
          style: school-term-3
        term 4:
          start_date: 2025-10-13
          end_date: 2025-12-12
          style: school-term-4
      width: 12

    # legend - required for row labeling
    legend:
      type: annotation
      iterate: False
      width: 17
      style: legend

    # The main calendar columns
    monday:
      type: week_day
      iterate: False
      width: 20
      style: date
    tuesday:
      type: week_day
      iterate: False
      width: 20
      style: date
    wednesday:
      type: week_day
      iterate: False
      width: 20
      style: date
    thursday:
      type: week_day
      iterate: False
      width: 20
      style: date
    friday:
      type: week_day
      iterate: False
      width: 20
      style: date
    saturday:
      type: week_day
      iterate: False
      width: 30
      style: date
    sunday:
      type: week_day
      iterate: False
      width: 30
      style: date

    # Empty Notes
    notes:
      type: annotation
      iterate: False

    # Leave days
    leave:
      type: annotation
      iterate: False


#################
# Events  - used for rows
#################
