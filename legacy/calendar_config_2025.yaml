styles:
  heading:
    font:
      name: Arial
      size: 8
      bold: true
      italic: true
      strike: false
      underline: none 
      color: 'FF000000'
    fill:
      fill_type: solid
      fgColor: 'FFFFCC11'
    border:
      left:
        border_style: medium
        color: 'FF000000'
      right:
        border_style: thick
        color: 'FF000000'
      top:
        border_style: double
        color: 'FF000000'
      bottom:
        border_style: dashDotDot
        color: 'FF000000'
    alignment:
      horizontal: center
      vertical: bottom
      text_rotation: 0
      wrap_text: true
      shrink_to_fit: false
      indent: 0
    number_format: general
    protection:
      locked: true
      hidden: false

  # date rows
  date:
    font:
      name: Arial
      size: 8
      bold: true
      italic: false
      strike: false
      underline: none 
      color: 'FF000000'
    fill:
      fill_type: solid
      fgColor: 'FF999999'
    border:
      top:
        border_style: thin
        color: 'FF000000'
    alignment:
      horizontal: center
      vertical: center
      text_rotation: 0
      wrap_text: true
      shrink_to_fit: false
      indent: 0
    #number_format: ddd dd-mmm
    protection:
      locked: true
      hidden: false


