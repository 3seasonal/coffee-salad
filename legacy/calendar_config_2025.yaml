#################
# structure:
# - calendar: the configuration for making the calendar
# - columns
# bg_color: (optional) the background color of the cell


calendar:

  #################
  # calander base functionality
  xlsx_name: 2025_calendar_generated.xlsx
  worksheet_name: 2025 by week
  start_row: 2 #1 based
  start_column: 2 #1 based
  year: 2025
  underflow: 3 #no of rows (or other type) before the start and end date - rounded
  overflow: 3 #no of rows (or other type) after the start and end date - rounded
  mode: dev 
  debug: true

  #################
  # calander columns
  # columns{
  #   xcolumn{
  #   type: iterator/term/week_day/annotation
  #   iterate: true/false
  #   (start):x
  #   (increment):x
  #   (terms){
  #     term_name{
  #       start_date: yyyy-mm-dd
  #       end_date: yyyy-mm-dd
  #       bg_color: 000000  
  #     }
  #   }
  # } 
  # }
  
  columns:
    # week number
    week:
      type: iterator
      start: 1
      increment: 1
    
    # university Trimesters
    Uni:
      type: term
      iterate: true
      start: 1
      terms:
        trimester 1:
          start_date: 2025-01-01
          end_date: 2025-03-30
          bg_color: 'E2EFDA'
        trimester 2:
          start_date: 2025-04-01
          end_date: 2025-06-30
          bg_color: 'C6E0B4'
        trimester 3:
          start_date: 2025-07-01
          end_date: 2025-09-30
          bg_color: 'A9D08E'
  
    # School terms
    school: 
      type: term
      iterate: true
      start: 1
      terms:
        term 1:
          start_date: 2025-01-01
          end_date: 2025-03-31
          bg_color: 'DDEBF7'
        term 2:
          start_date: 2025-04-01
          end_date: 2025-06-30
          bg_color: 'BDD7EE'
        term 3:
          start_date: 2025-07-01
          end_date: 2025-09-30
          bg_color: 'DDEBF7'
        term 4:
          start_date: 2025-10-01
          end_date: 2025-12-30
          bg_color: 'BDD7EE'

    # legend - required for row labeling
    legend:
      type: annotation
      iterate: false

    # The main calendar columns
    Monday:
      type: week_day
      iterate: false
    Tuesday:
      type: week_day
      iterate: false
    Wednesday:
      type: week_day
      iterate: false
    Thursday:
      type: week_day
      iterate: false
    Friday:
      type: week_day
      iterate: false
    Saturday:
      type: week_day
      iterate: false
    Sunday:
      type: week_day
      iterate: false

    # Empty Notes
    notes:
      type: annotation
      iterate: false

    # Leave days
    leave:
      type: annotation
      iterate: false


#################
# Events  - used for rows
#################
# evets{
#   event_type{
#     event_name{
#       date: yyyy-mm-dd or:
#       (start_date: yyyy-mm-dd
#       end_date: yyyy-mm-dd)
#       description: xxxx
#       fixed_date: true/false
#     }
#   }

events:

  # dates are here

  # public holidays
  public holidays:
    new years day: 
      date: 2025-01-01
      description: xxxx
      fixed_date: true
    good friday: 
      date: 2025-07-04
      description: xxxx
      fixed_date: false
    easter monday: 
      date: 2025-07-07
      description: xxxx
      fixed_date: false
    anzac day: 
      date: 2025-04-25
      description: xxxx
      fixed_date: true
    kings birthday holiday: 
      date: 2025-06-02
      description: xxxx
      fixed_date: true
    labour day: 
      date: 2025-10-27
      description: xxxx
      fixed_date: true
    christmas day: 
      date: 2025-12-25
      description: xxxx
      fixed_date: true
    boxing day: 
      date: 2025-12-26
      description: xxxx
      fixed_date: true

  # School relarted events
  school:
    pupil free day: 
      date: 2025-01-10
      description: xxxx
    show_day: 
      date: 2025-01-10
      description: xxxx
    christmas_concert: 
      date: 2025-12-10
      description: xxxx
    interviews:
      date: 2025-10-01
      description: xxxx
    open_night:
      date: 2025-10-01
      description: xxxx

  # multi day events or festivals dates usually change each year
  multi-day events:
    ramadan:
      start_date: 2025-12-20
      end_date: 2026-01-31
      description: Ramadan is the ninth month of the Islamic calendar, observed by Muslims worldwide as a month of fasting, prayer, reflection and community. A commemoration of Muhammad's first revelation, the annual observance of Ramadan is regarded as one of the Five Pillars of Islam and lasts twenty-nine to thirty days, from one sighting of the crescent moon to the next.
      fixed_date: false
    eurovision:
      start_date: 2025-04-10
      end_date: 2025-04-27
      description: The Eurovision Song Contest by the European Broadcasting Union, the world's foremost alliance of public service media, representing 116 member organizations in 56 countries and an additional 34 Associates in Asia, Africa, Australasia and the Americas.
      fixed_date: false
  # International days - and other dates of significance
  observances:
    pi_day:
      date: 2025-03-14
      description: Pi Day is an annual celebration of the mathematical constant π (pi). Pi Day is observed on March 14 (3/14 in the month/day format) since 3, 1, and 4 are the first three significant digits of π.
      fixed_date: true
    international_pronouns_day:
      date: 2025-10-15
      description: International Pronouns Day seeks to make respecting, sharing, and educating about personal pronouns commonplace. Referring to people by the pronouns they determine for themselves is basic to human dignity. Being referred to by the wrong pronouns particularly
      fixed_date: true

  # Birthdays - happy birthday to you
  birthdays:
    john_doe:
      date: 2025-01-01
      birthday: 1999-01-01
      description: John Doe's birthday
      fixed_date: true

  # family events - holidays, social gatherings, birthday parties, etc
  family and friends:
    mothers day:
      date: 2025-05-11
      description: Family get-to-gether
      fixed_date: false
    Caribean holiday:
      start_date: 2025-04-10
      end_date: 2025-04-27
      description: Father's Day is a celebration honoring fathers and celebrating fatherhood, paternal bonds, and the influence of fathers in society.
      fixed_date: false

  # work events - meetings, conferences, leave, etc
  work:
    an important team meeting:
      date: 2025-01-10
      description: Team meeting
    IMW conference:
      start_date: 2025-04-10
      end_date: 2025-04-27
      description: Conference
    study_leave:
      date: 2025-03-10
      description: Leave day

  # study events - seminars, exams, due dates, etc
  study:
    exam for butchery:
      date: 2025-01-10
      description: Exam
    big seminar:
      date: 2025-02-10
      description: Seminar
    paper due date:
      date: 2025-03-10
      description: Microwave cooking assignment Due date

